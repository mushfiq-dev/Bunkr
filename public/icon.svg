<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- App Background Match -->
  <rect width="512" height="512" rx="128" fill="#121316"/>
  
  <!-- Subtle ambient ember glow -->
  <defs>
    <radialGradient id="bunkrGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#E85A14" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#E85A14" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#121316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="256" cy="230" r="220" fill="url(#bunkrGlow)"/>

  <!-- Scaled Emblem: Vortex & Radiant Star in Brand Orange -->
  <g transform="translate(76, 50) scale(2.25)">
    <!-- Outer Vortex Crescent Arm -->
    <path
      d="M 126 54 
         C 134 76, 126 102, 106 118 
         C 86 134, 58 134, 38 120 
         C 18 106, 12 80, 20 58 
         C 28 36, 48 22, 72 20 
         C 92 18, 114 26, 122 42 
         C 126 50, 122 56, 114 54 
         C 106 52, 98 42, 86 38 
         C 68 32, 48 40, 40 56 
         C 32 72, 38 92, 52 102 
         C 66 112, 86 112, 100 100 
         C 112 90, 116 74, 112 60 
         C 110 52, 116 46, 122 48 
         C 126 50, 126 52, 126 54 Z"
      fill="#E85A14"
    />

    <!-- Secondary Swoosh Curve -->
    <path
      d="M 62 20 
         C 90 18, 120 30, 128 58 
         C 132 72, 128 86, 120 98 
         C 118 96, 120 86, 118 76 
         C 116 60, 106 44, 92 34 
         C 80 26, 68 22, 54 22 
         C 48 22, 56 20, 62 20 Z"
      fill="#E85A14"
    />

    <!-- Concentric Orbit Ring -->
    <circle cx="72" cy="72" r="28" stroke="#E85A14" stroke-width="2.2" stroke-opacity="0.9"/>

    <!-- Crosshair Lines -->
    <line x1="72" y1="32" x2="72" y2="112" stroke="#E85A14" stroke-width="1.8" stroke-opacity="0.8"/>
    <line x1="32" y1="72" x2="112" y2="72" stroke="#E85A14" stroke-width="1.8" stroke-opacity="0.8"/>

    <!-- Radiant 4-Point Compass Star -->
    <polygon points="72,36 76,66 108,72 76,78 72,108 68,78 36,72 68,66" fill="#E85A14"/>
    <polygon points="72,52 77,67 92,72 77,77 72,92 67,77 52,72 67,67" fill="#E85A14" opacity="0.95"/>
    <polygon points="72,46 74,70 98,72 74,74 72,98 70,74 46,72 70,70" fill="#FF7A30" opacity="0.7"/>
    <circle cx="72" cy="72" r="3.5" fill="#FFA468"/>
  </g>

  <!-- Gothic Bunkr Wordmark at bottom -->
  <text x="256" y="440" text-anchor="middle" font-family="'UnifrakturMaguntia', 'Pirata One', serif" font-size="76" font-weight="bold" fill="#E85A14">Bunkr</text>
</svg>
